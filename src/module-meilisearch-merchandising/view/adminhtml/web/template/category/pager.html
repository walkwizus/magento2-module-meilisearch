<div class="admin__data-grid-pager-wrap merch-pager">
    <label class="merch-page-size">
        <select class="admin__control-select"
                data-bind="options: pageSizes, value: pageSize"></select>
        <span data-bind="i18n: 'per page'"></span>
    </label>
    <div class="admin__data-grid-pager">
        <button type="button" class="action-previous" data-bind="click: previousPage, disable: page() <= 1, attr: {title: $t('Previous Page')}">
            <span data-bind="i18n: 'Previous Page'"></span>
        </button>
        <input type="number"
               min="1"
               class="admin__control-text"
               data-bind="value: page(), attr: {max: pages()}, event: {change: onPageInputChange}">
        <label class="admin__control-support-text" data-bind="text: $t('of %1').replace('%1', pages())"></label>
        <button type="button" class="action-next" data-bind="click: nextPage, disable: page() >= pages(), attr: {title: $t('Next Page')}">
            <span data-bind="i18n: 'Next Page'"></span>
        </button>
    </div>
</div>
